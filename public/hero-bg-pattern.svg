<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <pattern id="nodes" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- Connection lines -->
      <line x1="20" y1="20" x2="50" y2="30" stroke="#1B5F99" stroke-width="0.8" opacity="0.5"/>
      <line x1="50" y1="30" x2="80" y2="20" stroke="#1B5F99" stroke-width="0.8" opacity="0.5"/>
      <line x1="20" y1="20" x2="30" y2="50" stroke="#1B5F99" stroke-width="0.8" opacity="0.5"/>
      <line x1="50" y1="30" x2="50" y2="60" stroke="#1B5F99" stroke-width="0.8" opacity="0.5"/>
      <line x1="80" y1="20" x2="70" y2="50" stroke="#1B5F99" stroke-width="0.8" opacity="0.5"/>
      <line x1="30" y1="50" x2="50" y2="60" stroke="#1B5F99" stroke-width="0.8" opacity="0.5"/>
      <line x1="50" y1="60" x2="70" y2="50" stroke="#1B5F99" stroke-width="0.8" opacity="0.5"/>
      <line x1="30" y1="50" x2="20" y2="80" stroke="#1B5F99" stroke-width="0.8" opacity="0.5"/>
      <line x1="50" y1="60" x2="50" y2="90" stroke="#1B5F99" stroke-width="0.8" opacity="0.5"/>
      <line x1="70" y1="50" x2="80" y2="80" stroke="#1B5F99" stroke-width="0.8" opacity="0.5"/>
      <!-- Nodes -->
      <circle cx="20" cy="20" r="3" fill="#1B5F99" opacity="0.6"/>
      <circle cx="50" cy="30" r="4" fill="#3A9BD0" opacity="0.5"/>
      <circle cx="80" cy="20" r="3" fill="#1B5F99" opacity="0.6"/>
      <circle cx="30" cy="50" r="3.5" fill="#E8723A" opacity="0.5"/>
      <circle cx="70" cy="50" r="3" fill="#1B5F99" opacity="0.6"/>
      <circle cx="50" cy="60" r="4" fill="#3A9BD0" opacity="0.5"/>
      <circle cx="20" cy="80" r="3" fill="#1B5F99" opacity="0.6"/>
      <circle cx="50" cy="90" r="3.5" fill="#E8723A" opacity="0.5"/>
      <circle cx="80" cy="80" r="3" fill="#1B5F99" opacity="0.6"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#nodes)"/>
</svg>
