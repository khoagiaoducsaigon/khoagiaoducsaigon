const $ = (s, r = document) => r.querySelector(s);

const fmtDT = iso => { if (!iso) return '—'; const d = new Date(iso); return d.toLocaleDateString('vi-VN') + ' ' + d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }); };
const fmtBytes = b => b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(1) + ' KB' : (b / 1048576).toFixed(2) + ' MB';

function toast(msg, type = 'info') {
  const map = { info: 'bg-slate-900', success: 'bg-emerald-600', error: 'bg-rose-600', warn: 'bg-amber-600' };
  const icons = { info: 'info', success: 'circle-check', error: 'circle-x', warn: 'triangle-alert' };

  el.className = `${map[type] || map.info} fade-in text-white text-sm px-4 py-3 rounded-xl shadow-lg flex items-start gap-2 max-w-sm`;
  el.innerHTML = ic(icons[type] || 'info', 'w-4 h-4 mt-0.5 shrink-0') + `<span>${esc(msg)}</span>`;
  $('#toasts').appendChild(el); refreshIcons();
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 3600);
}
function download(blob, filename) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function stamp() { const d = new Date(); return d.toISOString().slice(0, 10).replace(/-/g, '') + '_' + String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0'); }
async function hashPw(pw) {
  const salted = 'edulesson::' + pw;
  try {
    if (window.crypto && crypto.subtle) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salted));
      return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
    }
  } catch (e) { /* bối cảnh không an toàn */ }
  let h = 0; for (const c of salted) h = (h * 31 + c.charCodeAt(0)) | 0; return 'f' + h;
}
/* Trình hiển thị Markdown tối giản */
function md(text) {
  const inline = s => s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*(?!\s)(.+?)\*/g, '$1<em>$2</em>');
  let html = '', list = false;
  for (const raw of esc(text || '').split('\n')) {
    const l = raw.trimEnd();
    if (/^\s*[-*•]\s+/.test(l)) { if (!list) { html += '<ul class="list-disc pl-5 space-y-1 my-1">'; list = true; } html += `<li>${inline(l.replace(/^\s*[-*•]\s+/, ''))}</li>`; continue; }
    if (list) { html += '</ul>'; list = false; }
    if (/^#{1,2}\s+/.test(l)) html += `<h3>${inline(l.replace(/^#+\s+/, ''))}</h3>`;
    else if (/^#{3,}\s+/.test(l)) html += `<h4>${inline(l.replace(/^#+\s+/, ''))}</h4>`;
    else if (/^&gt;\s?/.test(l)) html += `<blockquote>${inline(l.replace(/^&gt;\s?/, ''))}</blockquote>`;
    else if (!l.trim()) html += '<div class="h-1.5"></div>';
    else html += `<p>${inline(l)}</p>`;
  }
  if (list) html += '</ul>';
  return `<div class="md text-sm text-slate-700 leading-relaxed">${html}</div>`;
}
const mdPlain = t => String(t || '').replace(/\*\*(.+?)\*\*/g, '$1').replace(/^#+\s+/gm, '').replace(/^>\s?/gm, '');

const DB = {
  name: 'edulesson_copilot_db', version: 1, idb: null, mode: 'IndexedDB', cache: {}, silent: false,
  async init() {
    STORES.forEach(s => this.cache[s] = []);
    try {
      if (!window.indexedDB) throw new Error('no idb');
      this.idb = await new Promise((res, rej) => {
        const r = indexedDB.open(this.name, this.version);
        r.onupgradeneeded = () => { const db = r.result; STORES.forEach(s => { if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: 'id' }); }); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });

  queue() { try { return JSON.parse(localStorage.getItem(LS.cloudQueue) || '[]'); } catch (e) { return []; } },
  saveQueue(q) { try { localStorage.setItem(LS.cloudQueue, JSON.stringify(q)); } catch (e) {} },
  enqueue(op, store, id) { const q = this.queue().filter(x => !(x.store === store && x.id === id)); q.push({ op, store, id }); this.saveQueue(q); },
  ok() { this.lastSync = nowISO(); this.setStatus(this.queue().length ? (navigator.onLine ? 'error' : 'offline') : 'online', this.queue().length ? 'Còn ' + this.queue().length + ' thay đổi chờ gửi' : ''); },
  fail(e, items) {

  expired(e) {

  push(store, obj) {

  async pushMany(store, list) {

  /* Gửi lại các thay đổi đã lưu khi mất mạng. Trả về true nếu hàng đợi đã sạch. */

  /* Vòng cập nhật: 4 giây khi đang xem, 30 giây khi chuyển tab khác */

/* Lưu lại dữ liệu cục bộ trước lần đầu kết nối máy chủ để Admin có thể đẩy lên */

// ---------------------------------------------------------------- 6. PHÂN TÍCH HỌC TẬP (Learning Analytics)
function detectCauses(diffs) {
  return CAUSE_RULES.map(r => {
    const hits = diffs.filter(l => r.re.test(`${l.behavior} ${l.suggestion || ''}`));
    return { ...r, hits: hits.length, minutes: hits.map(h => h.minute) };
  }).filter(c => c.hits > 0).sort((a, b) => b.hits - a.hits);
}
function computeStats(lesson) {
  const logs = obsLogs(lesson.id).filter(l => l.kind !== 'feedback');
  const dur = Number(lesson.duration) || 45;
  let eng = 0, obs = 0; logs.forEach(l => { if (Number(l.observed) > 0) { eng += Number(l.engaged) || 0; obs += Number(l.observed); } });
  const activeRate = obs ? Math.round(eng / obs * 100) : null;
  const acts = lesson.activities || [];
  const totalMin = acts.reduce((s, a) => s + Math.max(0, a.end - a.start), 0) || dur;
  const talkMin = acts.reduce((s, a) => s + Math.min(Number(a.teacherTalk) || 0, Math.max(0, a.end - a.start)), 0);
  const teacherPct = pct(talkMin, totalMin);
  const diffs = logs.filter(l => l.level === 'difficulty');
  let best = { count: 0, start: null };
  for (let t = 0; t < dur; t++) { const c = diffs.filter(l => l.minute >= t && l.minute < t + 5).length; if (c > best.count) best = { count: c, start: t }; }
  let bottleneck = null;
  if (best.count) {
    const inWin = diffs.filter(l => l.minute >= best.start && l.minute < best.start + 5);
    const from = Math.min(...inWin.map(l => l.minute)), to = Math.max(...inWin.map(l => l.minute));
    bottleneck = { from, to, count: best.count, logs: inWin, activity: activityAt(lesson, from) };
  }
  const phaseCount = {}; Object.keys(PHASES).forEach(k => phaseCount[k] = logs.filter(l => l.phase === k).length);
  const levelCount = {}; Object.keys(LEVELS).forEach(k => levelCount[k] = logs.filter(l => l.level === k).length);
  return { logs, dur, activeRate, teacherPct, studentPct: 100 - teacherPct, talkMin, totalMin, diffs, bottleneck, phaseCount, levelCount, causes: detectCauses(diffs) };
}
const rateLabel = r => r == null ? 'chưa có số liệu' : r >= 80 ? 'mức Tốt ≥ 80%' : r >= 65 ? 'mức Khá' : 'cần cải thiện';

function mockAnalysis(lesson) {
  const s = computeStats(lesson);
  if (!s.logs.length) return '## Chưa có dữ liệu\n- Hãy ghi nhật ký dự giờ ở Phân hệ 2 trước khi phân tích.';
  const L = [];
  L.push('## 1. Kết luận nhanh');
  L.push(`- Tỷ lệ học sinh tích cực học tập: **${s.activeRate ?? '—'}%** (${rateLabel(s.activeRate)}).`);
  L.push(`- Thời lượng GV nói ≈ **${s.teacherPct}%** (${s.talkMin}/${s.totalMin} phút) – HS hoạt động ≈ **${s.studentPct}%**. ${s.teacherPct <= 40 ? 'Đạt định hướng lấy HS làm trung tâm (GV nói ≤ 40%).' : 'GV nói còn nhiều – đề xuất giảm xuống ≤ 40%.'}`);
  if (s.bottleneck) L.push(`- Điểm nghẽn nhận thức tập trung ở **phút ${s.bottleneck.from}${s.bottleneck.to !== s.bottleneck.from ? '–' + s.bottleneck.to : ''}** (${s.bottleneck.count} tình huống) thuộc *${s.bottleneck.activity?.name || 'hoạt động chưa xác định'}*.`);
  L.push(`- Tổng ${s.logs.length} ghi chép: ${s.levelCount.positive} tích cực · ${s.levelCount.neutral} trung tính · ${s.levelCount.difficulty} khó khăn.`);
  L.push('## 2. Chẩn đoán nguyên nhân khó khăn');
  if (!s.causes.length) L.push('- Không phát hiện mẫu nguyên nhân lặp lại – các khó khăn mang tính cá biệt.');
  s.causes.forEach(c => L.push(`- **${c.label}** — ${c.hits}/${s.diffs.length} tình huống (phút ${c.minutes.join(', ')}).`));
  const ins = s.causes.find(c => c.key === 'instruction')?.hits || 0, mat = s.causes.find(c => c.key === 'material')?.hits || 0;
  if (ins && mat) L.push(`- **Nhận định:** điểm nghẽn mang tính *kép* – học liệu trực quan chưa đủ (${mat} lượt) làm khuếch đại hệ quả của lệnh giao việc chưa rõ (${ins} lượt). Ưu tiên sửa lệnh giao việc trước, đồng thời bổ sung mô hình trực quan.`);
  else if (ins) L.push('- **Nhận định:** nguyên nhân chính là **lệnh giao việc chưa rõ**, không phải do thiếu học liệu.');
  else if (mat) L.push('- **Nhận định:** nguyên nhân chính là **thiếu học liệu trực quan**, lệnh giao việc cơ bản đã rõ.');
  L.push('## 3. Khuyến nghị tinh chỉnh');
  (s.causes.length ? s.causes : CAUSE_RULES.slice(0, 2)).slice(0, 4).forEach(c => L.push(`- ${c.fix}`));
  if (s.teacherPct > 40) L.push('- Cắt giảm phần GV giảng giải, chuyển thành nhiệm vụ HS tự khám phá có phiếu hướng dẫn.');
  L.push('## 4. Câu hỏi gợi mở cho buổi thảo luận (Bước 3)');
  if (s.bottleneck) L.push(`- Vì sao ở phút ${s.bottleneck.from} học sinh ${s.bottleneck.logs[0]?.group ? 'nhóm ' + s.bottleneck.logs[0].group : ''} gặp khó khăn? Biểu hiện cụ thể là gì?`);
  L.push('- Học sinh đã học được gì, chưa học được gì? Bằng chứng từ sản phẩm học tập?');
  L.push('- Nếu dạy lại, tổ sẽ điều chỉnh lệnh giao việc / học liệu / cách tổ chức nhóm như thế nào?');
  L.push('> Phân tích bởi **Demo Sư phạm (Mock AI)** – bộ quy tắc Regex nhận diện 5 nhóm nguyên nhân trên dữ liệu nhật ký dự giờ. Kết nối Gemini API để có phân tích ngôn ngữ tự nhiên sâu hơn.');
  return L.join('\n');
}

function buildRubric(s) {
  const has = k => s.causes.some(c => c.key === k);
  const r32 = s.activeRate == null ? 'Đạt' : s.activeRate >= 80 ? 'Tốt' : s.activeRate >= 65 ? 'Khá' : 'Đạt';
  const map = {
    '1.1': ['Tốt', 'Chuỗi hoạt động bám sát mục tiêu, có sản phẩm rõ.'],
    '1.2': has('instruction') ? ['Đạt', 'Lệnh giao việc ở hoạt động khám phá chưa tách bước.'] : ['Tốt', 'Nhiệm vụ rõ ràng.'],
    '1.3': has('material') ? ['Khá', 'Cần bổ sung mô hình/học liệu trực quan lớn.'] : ['Tốt', 'Học liệu phù hợp.'],
    '1.4': ['Khá', 'Nên có phiếu kiểm tra nhanh sau phần hình thành kiến thức.'],
    '2.1': ['Tốt', 'Khởi động hấp dẫn, gắn thực tiễn.'],
    '2.2': has('support') ? ['Đạt', 'Một số nhóm khó khăn chưa được phát hiện kịp thời.'] : ['Khá', 'Quan sát khá bao quát.'],
    '2.3': has('grouping') ? ['Khá', 'Cần thẻ vai trò để mọi HS cùng tham gia.'] : ['Tốt', 'Hợp tác nhóm hiệu quả.'],
    '2.4': ['Khá', 'Chốt kiến thức rõ, nên tận dụng lỗi sai của HS.'],
    '3.1': has('instruction') ? ['Khá', 'Một số nhóm chậm tiếp nhận nhiệm vụ.'] : ['Tốt', 'HS tiếp nhận nhanh.'],
    '3.2': [r32, `Tỷ lệ HS tích cực ${s.activeRate ?? '—'}%.`],
    '3.3': s.levelCount.positive && s.phaseCount.report ? ['Tốt', 'Báo cáo tự tin, có nhận xét bổ sung.'] : ['Khá', 'Cần tăng tương tác khi báo cáo.'],
    '3.4': has('concept') ? ['Khá', 'Còn nhầm lẫn khái niệm trọng tâm.'] : ['Tốt', 'Kết quả chính xác.']
  };
  return RUBRIC.map(r => ({ code: r.code, rating: map[r.code][0], note: map[r.code][1] }));
}

  const step3 = [
    `**a) GV dạy minh họa chia sẻ:** ${lesson.teacherReflection || 'GV chia sẻ mục tiêu, ý đồ sư phạm và những điểm chưa đạt so với dự kiến.'}`,

    rubric: buildRubric(s), status: 'draft', source: 'mock', createdAt: nowISO(), updatedAt: nowISO(), createdBy: state.user?.id || lesson.leaderId, exportCount: 0
  };
}

function buildMockAdaptedPlan(lesson) {
  const s = computeStats(lesson);
  const rows = (lesson.activities || []).map(a => {
    const dl = s.diffs.filter(l => l.minute >= a.start && l.minute < a.end);
    const pos = s.logs.filter(l => l.level === 'positive' && l.minute >= a.start && l.minute < a.end);
    const causes = detectCauses(dl);
    const talkHigh = (a.teacherTalk || 0) / Math.max(1, a.end - a.start) > 0.5;
    const original = `${a.desc || a.name} (${a.start}–${a.end}′, GV nói ~${a.teacherTalk || 0}′)`;
    let revised, reason;
    if (dl.length) {
      revised = causes.map(c => '• ' + c.fix).join('\n') + (talkHigh ? '\n• Giảm thời lượng GV giảng, chuyển thành nhiệm vụ HS tự khám phá.' : '');
      reason = dl.map(l => `Phút ${l.minute} (${l.group ? 'Nhóm ' + l.group : 'Cả lớp'}): ${l.behavior}`).join('\n');
    } else {
      revised = talkHigh ? '• Giữ mục tiêu; giảm phần GV giảng giải, tăng thời gian HS hoạt động.' : '• Giữ nguyên tiến trình; phát huy điểm mạnh đã quan sát được.';
      reason = pos.length ? pos.map(l => `Phút ${l.minute}: ${l.behavior}`).join('\n') : 'Không ghi nhận điểm nghẽn trong hoạt động này.';
    }
    return { activity: `${a.name} (${a.start}–${a.end}′)`, original, revised, reason };
  });
  return { id: uid('ap'), lessonId: lesson.id, version: 1, rows, note: 'Phương án được tổng hợp tự động từ nhật ký dự giờ và ý kiến thảo luận.', status: 'draft', source: 'mock', createdAt: nowISO(), createdBy: state.user?.id || lesson.teacherId };
}

async function callGemini(prompt, { json = false } = {}) {
  const key = Settings.get('apiKey'); const model = Settings.get('model') || 'gemini-2.5-flash';
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
    body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: prompt }] }], generationConfig: Object.assign({ temperature: 0.4 }, json ? { responseMimeType: 'application/json' } : {}) })
  });
  if (!res.ok) { let msg = res.status + ''; try { msg = (await res.json()).error?.message || msg; } catch (e) {} throw new Error(msg); }
  const j = await res.json();
  const text = (j.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('');
  if (!text) throw new Error('Phản hồi rỗng');
  return text;
}
const parseJSONLoose = t => { const m = String(t).match(/[\[{][\s\S]*[\]}]/); return JSON.parse(m ? m[0] : t); };
const aiReady = () => Settings.get('aiMode') === 'gemini' && !!Settings.get('apiKey');
async function aiRun(mockFn, prompt, opts = {}) {
  if (!aiReady()) { await sleep(650); return { data: mockFn(), source: 'mock' }; }
  try { const t = await callGemini(prompt, opts); return { data: opts.json ? parseJSONLoose(t) : t, source: 'gemini' }; }
  catch (e) { console.error(e); toast('Gemini lỗi: ' + e.message + ' → dùng Demo Sư phạm.', 'warn'); return { data: mockFn(), source: 'mock' }; }
}

  });
}

A.authTab = t => { state.authTab = t; render(); };
A.login = async () => {
  const c = $('#lgContact').value.trim().toLowerCase(), pw = $('#lgPw').value; const err = $('#authErr');
  if (Cloud.on) {
    const btn = $('#btnLogin'); btn.disabled = true; err.textContent = '';
    try { await Cloud.login(c, pw); await finishCloudSignIn('Đăng nhập'); }
    catch (e) { err.textContent = e.status === 0 ? 'Không kết nối được máy chủ: ' + e.message : e.message; btn.disabled = false; Cloud.setStatus('off'); }
    return;
  }
  const u = DB.all('users').find(x => x.contact.toLowerCase() === c);
  if (!u || u.passwordHash !== await hashPw(pw)) { err.textContent = 'Sai thông tin đăng nhập.'; return; }
  if (u.status === 'locked') { err.textContent = 'Tài khoản đã bị khóa. Liên hệ Ban Giám hiệu.'; return; }
  if (u.status === 'pending') { err.textContent = 'Tài khoản đang chờ Admin phê duyệt.'; return; }
  await signIn(u, 'Đăng nhập');
};
A.register = async () => {
  const v = id => $('#' + id).value.trim(); const err = $('#authErr');
  const name = v('rgName'), contact = v('rgContact'), role = v('rgRole'), campus = v('rgCampus'), department = v('rgDept'), pw = $('#rgPw').value, pw2 = $('#rgPw2').value;
  const isEmail = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(contact), isPhone = /^(?:0|\+84)\d{9,10}$/.test(contact.replace(/[\s.]/g, ''));
  if (name.length < 3) return err.textContent = 'Họ tên tối thiểu 3 ký tự.';
  if (!isEmail && !isPhone) return err.textContent = 'Email hoặc số điện thoại không hợp lệ.';
  if (!Cloud.on && DB.all('users').some(u => u.contact.toLowerCase() === contact.toLowerCase())) return err.textContent = 'Email/SĐT đã được đăng ký.';
  if (pw.length < 6) return err.textContent = 'Mật khẩu tối thiểu 6 ký tự.';
  if (pw !== pw2) return err.textContent = 'Mật khẩu nhập lại không khớp.';
  if (Cloud.on) {
    if (pw.length < 8) return err.textContent = 'Mật khẩu tối thiểu 8 ký tự.';
    const btn = $('#btnRegister'); btn.disabled = true;
    try {
      const j = await Cloud.req('auth/register', { method: 'POST', body: { name, login: contact, password: pw, role, campus, department } });
      if (j.token) {
        Cloud.token = j.token; localStorage.setItem(LS.token, j.token);
        await Cloud.afterLogin(j.user); await finishCloudSignIn('Đăng ký');
        toast('Chào mừng ' + name + '! Bạn là Admin đầu tiên của trường.', 'success');
      } else { state.authTab = 'login'; render(); toast('Đăng ký thành công! Tài khoản đang chờ Ban Giám hiệu phê duyệt.', 'success'); }
    } catch (e) { err.textContent = e.message; btn.disabled = false; }
    return;
  }
  const u = { id: uid('u'), name, contact, role, campus, department, title: ROLES[role].label, passwordHash: await hashPw(pw), status: role === 'admin' ? 'pending' : 'active', createdAt: nowISO(), lastLogin: null };
  await DB.put('users', u);
  const prev = state.user; state.user = u; await audit('Đăng ký', 'users', `${name} – ${ROLES[role].label} – ${campus}`); state.user = prev;
  if (u.status === 'pending') { state.authTab = 'login'; render(); toast('Đăng ký thành công! Tài khoản BGH đang chờ phê duyệt.', 'success'); return; }
  await signIn(u, 'Đăng nhập');
  toast('Chào mừng ' + name + '!', 'success');
};
async function finishCloudSignIn(action) {
  const u = state.user; state.viewAs = null;
  u.lastLogin = nowISO(); await DB.put('users', u);
  await audit(action, 'users', `${u.name} (${ROLES[u.role].label}) – máy chủ`);
  if (state.tab === 'admin' && u.role !== 'admin') state.tab = 'plan';
  ensureLesson(); render();
}
async function signIn(u, action) {
  u.lastLogin = nowISO(); await DB.put('users', u);
  state.user = u; state.viewAs = null; localStorage.setItem(LS.session, u.id);
  await audit(action, 'users', `${u.name} (${ROLES[u.role].label})`);
  if (state.tab === 'admin' && u.role !== 'admin') state.tab = 'plan';
  ensureLesson(); render();
}
A.quickSwitch = async role => {
  if (Cloud.on) {
    if (!state.user) return toast('Chế độ máy chủ: hãy đăng nhập bằng tài khoản của bạn.', 'warn');
    if (state.user.role !== 'admin') return toast('Chỉ Ban Giám hiệu được xem giao diện theo vai trò khác.', 'warn');
    state.viewAs = role === 'admin' ? null : role; render();
    return toast(role === 'admin' ? 'Đã trở về giao diện Ban Giám hiệu.' : `Đang XEM giao diện của "${ROLES[role].label}" (danh tính vẫn là bạn).`, 'success');
  }
  const order = ['u_quan', 'u_hanh', 'u_bao', 'u_trang', 'u_nam', 'u_linh'];
  const cands = DB.where('users', u => u.role === role && u.status === 'active').sort((a, b) => ((order.indexOf(a.id) + 99) % 99) - ((order.indexOf(b.id) + 99) % 99));
  if (!cands.length) return toast('Không có tài khoản hoạt động cho vai trò này.', 'error');
  await signIn(cands[0], 'Chuyển vai trò');
  toast(`Đang dùng vai trò: ${ROLES[role].label} – ${cands[0].name}`, 'success');
};
A.logout = async expired => {
  if (state.user && expired !== true) await audit('Đăng xuất', 'users', state.user.name);
  if (Cloud.on) {
    await Cloud.settle(); Cloud.stop();
    if (expired !== true) { try { await Cloud.req('auth/logout', { method: 'POST', timeout: 5000 }); } catch (e) {} }
    Cloud.clearToken();
    for (const st of STORES) await DB.clear(st); // không để lại dữ liệu trường trên máy dùng chung
    Cloud.setStatus('off');
  }
  state.user = null; state.viewAs = null; localStorage.removeItem(LS.session); render();
};
A.forgotPw = () => toast('Vì an toàn, hãy liên hệ Ban Giám hiệu để được đặt lại mật khẩu (Admin Dashboard → Quản trị người dùng).', 'info');
A.changePw = () => openModal({ title: 'Đổi mật khẩu', icon: 'key-round', size: 'max-w-md', body: `<div class="space-y-3">
    <div><label class="${LABEL}">Mật khẩu hiện tại</label><input id="cpOld" type="password" class="${INPUT}" autocomplete="current-password"></div>

    <p class="text-xs text-slate-500">Các phiên đăng nhập trên máy khác sẽ bị đăng xuất.</p></div>`,
  footer: `<button onclick="A.closeModal()" class="${B.secondary}">Hủy</button><button onclick="A.savePw()" class="${B.primary}">${ic('save')}Đổi mật khẩu</button>` });
A.savePw = async () => {
  const o = $('#cpOld').value, n = $('#cpNew').value;
  if (n.length < 8) return toast('Mật khẩu mới tối thiểu 8 ký tự.', 'warn');
  if (n !== $('#cpNew2').value) return toast('Mật khẩu nhập lại không khớp.', 'warn');
  try { await Cloud.req('auth/password', { method: 'POST', body: { old_password: o, new_password: n } }); A.closeModal(); await audit('Đổi mật khẩu', 'users', state.user.name); toast('Đã đổi mật khẩu.', 'success'); }
  catch (e) { toast(e.message, 'error'); }
};
A.syncNow = async () => {
  if (Cloud.pending) { Cloud.pending = false; ensureLesson(); render(); return toast('Đã cập nhật dữ liệu mới nhất.', 'success'); }
  await Cloud.resync(); toast(Cloud.status === 'online' ? 'Đã đồng bộ với máy chủ.' : 'Chưa đồng bộ được: ' + Cloud.error, Cloud.status === 'online' ? 'success' : 'warn');
};

A.aiSuggestLesson = async () => {
  const title = $('#lfTitle').value.trim(), subject = $('#lfSubject').value, grade = $('#lfGrade').value;
  if (!title) return toast('Nhập tên bài học trước.', 'warn');
  const btn = $('#btnAiSuggest'); btn.disabled = true; btn.innerHTML = 'Đang gợi ý...';
  const r = await aiRun(() => mockLessonSuggest(title, subject, grade), `Bạn là chuyên gia SHCM theo Nghiên cứu bài học (CV 1315/BGDĐT-GDTrH, CTGDPT 2018). Với bài "${title}" môn ${subject} lớp ${grade}, trả về JSON {"objectives":[4 mục tiêu HS cần đạt, ngắn gọn, động từ đo lường được],"focus":"hoạt động học trọng tâm cần quan sát kỹ","rq":"câu hỏi nghiên cứu của tổ"} bằng tiếng Việt.`, { json: true });
  const d = r.data || {};
  if (Array.isArray(d.objectives)) $('#lfObj').value = d.objectives.join('\n');
  if (d.focus) $('#lfFocus').value = d.focus; if (d.rq) $('#lfRQ').value = d.rq;
  btn.disabled = false; btn.innerHTML = ic('sparkles', 'w-3.5 h-3.5') + 'AI gợi ý mục tiêu'; refreshIcons();
  toast(`Đã gợi ý (${r.source === 'gemini' ? 'Gemini' : 'Demo Sư phạm'}).`, 'success');
};
A.saveLesson = async id => {
  const v = k => $('#' + k).value.trim();

  const acts = $$('.act-row').map(r => { const g = f => r.querySelector(`[data-f="${f}"]`).value; return { name: g('name').trim(), start: +g('start') || 0, end: +g('end') || 0, phase: g('phase'), teacherTalk: +g('teacherTalk') || 0, desc: g('desc').trim() }; }).filter(a => a.name).sort((a, b) => a.start - b.start);
  if (acts.some(a => a.end <= a.start)) return toast('Mỗi hoạt động cần phút kết thúc > phút bắt đầu.', 'warn');
  const base = id ? DB.get('lesson_studies', id) : { id: uid('ls'), status: 'planning', approved: false, feedbacks: [], planFile: null, createdBy: state.user.id, createdAt: nowISO(), leaderId: state.user.role === 'leader' ? state.user.id : (DB.all('users').find(u => u.role === 'leader')?.id || null) };

  });
  await DB.put('lesson_studies', base); await audit(id ? 'Sửa bài học' : 'Thêm bài học', 'lesson_studies', `${base.subject} ${base.grade} – ${base.title}`);

function parseQuickNote(raw) {
  const t = raw.normalize('NFC');
  const num = re => { const m = t.match(re); return m ? parseInt(m[1], 10) : null; };
  const minute = num(/ph[uú]t\s*(?:th[uứ]\s*)?(\d{1,3})/i) ?? num(/^\s*(\d{1,2})\s*['′:]/);
  const group = num(/nh[oó]m\s*(\d{1,2})/i), ban = num(/b[aà]n\s*(\d{1,2})/i);
  let phase = 'individual';
  if (/b[aá]o c[aá]o|tr[iì]nh b[aà]y|chia s[eẻ] tr[uư][oớ]c l[oớ]p/i.test(t)) phase = 'report';
  else if (/th[aả]o lu[aậ]n|nh[oó]m tr[uư][oở]ng|ph[aâ]n c[oô]ng|h[oợ]p t[aá]c/i.test(t)) phase = 'group';
  else if (/ti[eế]p nh[aậ]n|giao (?:vi[eệ]c|nhi[eệ]m v[uụ])|y[eê]u c[aầ]u|h[oỏ]i l[aạ]i/i.test(t)) phase = 'receive';
  let level = 'neutral';
  if (/l[uú]ng t[uú]ng|kh[oó] kh[aă]n|ch[uư]a|nh[aầ]m|sai|ng[oồ]i ch[oờ]|m[aấ]t t[aậ]p trung|h[oỏ]i l[aạ]i|kh[oô]ng hi[eể]u/i.test(t)) level = 'difficulty';

  const behavior = t.replace(/^\s*ph[uú]t\s*(?:th[uứ]\s*)?\d{1,3}\s*[:\-–,.]?\s*/i, '').trim();

function lineChart(l, s) {
  const W = 640, H = 230, P = { l: 38, r: 14, t: 14, b: 30 }, dur = s.dur;
  const x = m => P.l + (m / dur) * (W - P.l - P.r), y = v => P.t + (1 - v / 100) * (H - P.t - P.b);
  const pts = s.logs.filter(o => Number(o.observed) > 0).map(o => ({ m: o.minute, v: Math.round(o.engaged / o.observed * 100), o }));
  let svg = `<svg viewBox="0 0 ${W} ${H}" class="w-full h-auto" role="img" aria-label="Biểu đồ mức độ tích cực">`;
  (l.activities || []).forEach(a => { svg += `<rect x="${x(a.start)}" y="${P.t}" width="${x(a.end) - x(a.start)}" height="${H - P.t - P.b}" fill="${PHASES[a.phase]?.hex}" opacity="0.08"/><text x="${x(a.start) + 3}" y="${P.t + 10}" font-size="9" fill="#64748b">${esc(a.name.split('.')[0])}</text>`; });
  if (s.bottleneck) svg += `<rect x="${x(s.bottleneck.from) - 6}" y="${P.t}" width="${x(s.bottleneck.to) - x(s.bottleneck.from) + 12}" height="${H - P.t - P.b}" fill="#e11d48" opacity="0.12"/><text x="${x(s.bottleneck.from) - 4}" y="${H - P.b - 6}" font-size="10" font-weight="700" fill="#e11d48">Điểm nghẽn</text>`;
  [0, 25, 50, 75, 100].forEach(v => { svg += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" stroke="#e2e8f0" stroke-dasharray="${v ? '3 3' : ''}"/><text x="${P.l - 6}" y="${y(v) + 3}" font-size="10" text-anchor="end" fill="#94a3b8">${v}%</text>`; });
  for (let m = 0; m <= dur; m += 5) svg += `<text x="${x(m)}" y="${H - 10}" font-size="10" text-anchor="middle" fill="#94a3b8">${m}′</text>`;
  svg += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(80)}" y2="${y(80)}" stroke="#10b981" stroke-width="1"/><text x="${W - P.r}" y="${y(80) - 4}" font-size="9" text-anchor="end" fill="#10b981">Mục tiêu 80%</text>`;
  if (pts.length > 1) svg += `<polyline fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linejoin="round" points="${pts.map(p => `${x(p.m)},${y(p.v)}`).join(' ')}"/>`;
  pts.forEach(p => { svg += `<circle cx="${x(p.m)}" cy="${y(p.v)}" r="5.5" fill="${LEVELS[p.o.level]?.hex}" stroke="#fff" stroke-width="2"><title>Phút ${p.m}: ${p.v}% – ${esc(p.o.behavior)}</title></circle>`; });
  return svg + '</svg>';
}
function heatmap(l, s) {
  const bins = Math.ceil(s.dur / 5), groups = l.groups || 6;
  const color = r => r < 50 ? '#e11d48' : r < 65 ? '#fb923c' : r < 80 ? '#fcd34d' : r < 95 ? '#34d399' : '#059669';
  const lvlRate = { difficulty: 40, neutral: 70, positive: 95 };
  const bn = s.bottleneck ? [Math.floor(s.bottleneck.from / 5), Math.floor(s.bottleneck.to / 5)] : null;
  let h = `<div class="overflow-x-auto"><table class="w-full border-separate" style="border-spacing:3px"><thead><tr><th class="text-[11px] text-slate-500 text-left font-medium pr-2">Nhóm \\ Phút</th>${Array.from({ length: bins }, (_, b) => `<th class="text-[10px] font-medium ${bn && b >= bn[0] && b <= bn[1] ? 'text-rose-600 font-bold' : 'text-slate-500'}">${b * 5}–${Math.min(s.dur, b * 5 + 5)}</th>`).join('')}</tr></thead><tbody>`;
  for (let g = 0; g <= groups; g++) {
    h += `<tr><td class="text-xs font-semibold text-slate-600 pr-2 whitespace-nowrap">${g ? 'Nhóm ' + g : 'Cả lớp'}</td>`;
    for (let b = 0; b < bins; b++) {
      const cell = s.logs.filter(o => (o.group || 0) === g && Math.min(bins - 1, Math.floor(o.minute / 5)) === b);
      if (!cell.length) { h += `<td class="h-9 min-w-[44px] rounded-md bg-slate-100"></td>`; continue; }
      const rates = cell.map(o => Number(o.observed) > 0 ? o.engaged / o.observed * 100 : lvlRate[o.level]);
      const r = Math.round(rates.reduce((a, c) => a + c, 0) / rates.length);
      h += `<td class="h-9 min-w-[44px] rounded-md text-center text-[10px] font-bold text-white cursor-help ${bn && b >= bn[0] && b <= bn[1] ? 'ring-2 ring-rose-600' : ''}" style="background:${color(r)}" title="${cell.map(o => `Phút ${o.minute}: ${esc(o.behavior)}`).join('&#10;')}">${r}%</td>`;
    }
    h += '</tr>';
  }
  return h + '</tbody></table></div>';
}

function campusStats() {
  const lessons = DB.all('lesson_studies'), logs = DB.where('observation_logs', o => o.kind !== 'feedback'), users = DB.all('users');
  const contributors = new Set([...logs.map(o => o.observerId), ...lessons.flatMap(l => (l.feedbacks || []).map(f => f.userId))]);
  const campuses = [...new Set([...CAMPUSES, ...lessons.map(l => l.campus), ...users.map(u => u.campus)])].filter(Boolean);
  return campuses.map(c => {
    const ls = lessons.filter(l => l.campus === c); const lg = logs.filter(o => ls.some(l => l.id === o.lessonId));
    const staff = users.filter(u => u.campus === c && u.role !== 'admin' && ['active', 'profile'].includes(u.status));
    const part = staff.length ? pct(staff.filter(u => contributors.has(u.id)).length, staff.length) : null;
    let e = 0, ob = 0; lg.forEach(o => { if (Number(o.observed) > 0) { e += +o.engaged || 0; ob += +o.observed; } });
    const act = ob ? Math.round(e / ob * 100) : null; const done = ls.length ? pct(ls.filter(l => l.status === 'discussed').length, ls.length) : null;
    const quality = ls.length ? Math.round(0.4 * (done || 0) + 0.3 * (act ?? 0) + 0.3 * (part ?? 0)) : null;
    const cross = lg.filter(o => userById(o.observerId) && userById(o.observerId).campus !== c).length;
    return { campus: c, lessons: ls.length, logs: lg.length, staff: staff.length, part, act, done, quality, cross, minutes: ls.filter(l => minutesOf(l.id)).length };
  }).filter(x => x.lessons || x.staff);
}

A.saveUser = async id => {
  const v = k => $('#' + k).value.trim(); const name = v('ufName'), contact = v('ufContact'), pw = $('#ufPw').value;

A.exportCSV = async store => {
  let rows = DB.all(store).map(r => { const o = { ...r }; delete o.passwordHash; if (o.planFile) o.planFile = o.planFile.name; return o; });
  if (!rows.length) return toast('Bảng không có dữ liệu.', 'warn');
  const cols = [...new Set(rows.flatMap(r => Object.keys(r)))];
  const cell = v => { const s = v == null ? '' : typeof v === 'object' ? JSON.stringify(v) : String(v); return /[",\n;]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const csv = [cols.join(','), ...rows.map(r => cols.map(c => cell(r[c])).join(','))].join('\r\n');
  download(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }), `EduLesson_${store}_${stamp()}.csv`);
  await audit('Sao lưu dữ liệu', store, `CSV – ${rows.length} bản ghi`); toast(`Đã xuất CSV ${STORE_LABELS[store]}.`, 'success');
};
A.importJSON = input => {

    try {

      if (!STORES.some(s => Array.isArray(data[s]))) throw new Error('Không đúng định dạng sao lưu EduLesson.');
      if (Cloud.active) {

      await DB.replaceAll(data);
      const me = state.user && userById(state.user.id);
      if (!me || me.status !== 'active') { state.user = null; localStorage.removeItem(LS.session); render(); return toast('Đã khôi phục. Vui lòng đăng nhập lại.', 'success'); }
      state.user = me; await audit('Khôi phục dữ liệu', 'database', f.name); state.lessonId = null; ensureLesson(); render(); toast('Khôi phục dữ liệu thành công.', 'success');
    } catch (e) { toast('Lỗi khôi phục: ' + e.message, 'error'); }
    input.value = '';
  };
  rd.readAsText(f);
};
async function cloudMerge(data) {
  const existing = new Set(DB.all('users').map(u => u.id)); let n = 0;
  const users = (data.users || []).filter(u => !existing.has(u.id)).map(u => { const o = { ...u, status: 'profile' }; delete o.passwordHash; return o; });
  if (users.length) { await DB.putMany('users', users); n += users.length; }
  for (const st of STORES.filter(x => x !== 'users')) { const list = data[st] || []; if (list.length) { await DB.putMany(st, list); n += list.length; } }
  return n;
}

  openModal({ title: 'Cấu hình trí tuệ nhân tạo', icon: 'sparkles', body: `<div class="space-y-4">
    <div class="grid sm:grid-cols-2 gap-3">
      ${[['mock', 'bot', 'Demo Sư phạm / Mock AI', 'Chạy ngay, không cần API key. Bộ quy tắc Regex + mẫu biên bản chuẩn.'], ['gemini', 'sparkles', 'Google Gemini API', 'Phân tích ngôn ngữ tự nhiên, tổng hợp biên bản sâu hơn.']].map(([k, i, t, d]) => `<label class="cursor-pointer"><input type="radio" name="aiMode" value="${k}" class="peer sr-only" ${mode === k ? 'checked' : ''}><div class="h-full p-4 rounded-2xl ring-1 ring-slate-200 peer-checked:ring-2 peer-checked:ring-violet-500 peer-checked:bg-violet-50"><div class="font-semibold flex items-center gap-2">${ic(i, 'w-4 h-4 text-violet-600')}${t}</div><div class="text-xs text-slate-500 mt-1">${d}</div></div></label>`).join('')}
    </div>
    <div><label class="${LABEL}">Gemini API Key</label><div class="flex gap-2"><input id="aiKey" type="password" class="${INPUT} font-mono" value="${esc(Settings.get('apiKey'))}" placeholder="AIza..." autocomplete="off"><button type="button" onclick="const k=$('#aiKey');k.type=k.type==='password'?'text':'password'" class="${B.secondary} !px-3">${ic('eye')}</button></div>
      <p class="text-[11px] text-slate-500 mt-1">Lấy khóa tại Google AI Studio (aistudio.google.com). Khóa chỉ lưu trong LocalStorage của trình duyệt này và được gửi trực tiếp tới Google.</p></div>
    <div><label class="${LABEL}">Mô hình</label><select id="aiModel" class="${INPUT}">${['gemini-2.5-flash', 'gemini-2.5-pro', 'gemini-2.0-flash', 'gemini-2.5-flash-lite'].map(m => `<option ${m === Settings.get('model') ? 'selected' : ''}>${m}</option>`).join('')}</select></div>
    <div id="aiTest" class="text-sm"></div>
    <div class="text-xs p-3 rounded-xl bg-amber-50 text-amber-800 flex gap-2">${ic('shield-alert', 'w-4 h-4 shrink-0')}Bảo vệ dữ liệu: dữ liệu gửi tới Gemini chỉ gồm nội dung bài học và nhật ký quan sát (không gửi họ tên học sinh). Không nhập thông tin định danh học sinh vào ghi chép.</div>
  </div>`, footer: `<button onclick="A.testAI()" class="${B.secondary}">${ic('plug-zap')}Kiểm tra kết nối</button><button onclick="A.saveAI()" class="${B.primary}">${ic('save')}Lưu cấu hình</button>` });
};
A.testAI = async () => {
  const key = $('#aiKey').value.trim(); const out = $('#aiTest'); if (!key) { out.innerHTML = '<span class="text-rose-600">Chưa nhập API key.</span>'; return; }
  out.innerHTML = '<span class="text-slate-500">Đang kiểm tra...</span>';
  const prevK = Settings.get('apiKey'), prevM = Settings.get('model'); Settings.d.apiKey = key; Settings.d.model = $('#aiModel').value;
  try { const t = await callGemini('Trả lời đúng 1 câu tiếng Việt: "Kết nối thành công với EduLesson Study CoPilot."'); out.innerHTML = `<span class="text-emerald-600">✓ ${esc(t.trim().slice(0, 120))}</span>`; }
  catch (e) { out.innerHTML = `<span class="text-rose-600">✗ ${esc(e.message)}</span>`; }
  finally { Settings.d.apiKey = prevK; Settings.d.model = prevM; }
};
A.saveAI = async () => {
  const mode = document.querySelector('input[name="aiMode"]:checked').value, key = $('#aiKey').value.trim();
  if (mode === 'gemini' && !key) return toast('Chế độ Gemini cần API key.', 'warn');
  Settings.set('aiMode', mode); Settings.set('apiKey', key); Settings.set('model', $('#aiModel').value);
  await audit('Cấu hình AI', 'settings', `${mode === 'gemini' ? 'Gemini ' + $('#aiModel').value : 'Demo Sư phạm'}`); A.closeModal(); render(); toast('Đã lưu cấu hình AI.', 'success');
};
A.closeModal = () => { $('#modalRoot').innerHTML = ''; };
document.addEventListener('keydown', e => { if (e.key === 'Escape') A.closeModal(); });
document.addEventListener('click', e => { $$('details[open]').forEach(d => { if (!d.contains(e.target)) d.removeAttribute('open'); }); });

// ---------------------------------------------------------------- 11. KHỞI ĐỘNG
async function boot() {
  Settings.load();
  await DB.init();
  if (await Cloud.detect()) {
    DB.mode = 'MySQL (máy chủ trường) ⇄ IndexedDB';
    await Cloud.resume();
  } else {
    if (!DB.all('users').length) await seedDemo();
    const sid = localStorage.getItem(LS.session); const u = sid && userById(sid);
    if (u && u.status === 'active') state.user = u;
  }
  state.tab = localStorage.getItem(LS.tab) || 'plan';
  state.lessonId = localStorage.getItem(LS.lesson);
  ensureLesson();
  render();
}
boot().catch(e => { console.error(e); document.getElementById('app').innerHTML = `<div style="padding:40px;font-family:sans-serif">Lỗi khởi động: ${esc(e.message)}</div>`; });
</script>
</body>
</html>
