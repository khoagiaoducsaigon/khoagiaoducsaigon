  const blob = new Blob([content], { type: mime });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); let ok = false; try { ok = document.execCommand('copy'); } catch {} t.remove(); return ok; }
}
async function hashPw(pw) {
  const s = 'eduplan5512::' + pw;
  try {
    if (window.crypto?.subtle) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
      return 'sha256:' + [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
    }
  } catch {}
  let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
  return 'djb2:' + h.toString(16);
}

const DB_NAME = 'EduPlan5512DB', DB_VERSION = 1;
const TABLES = ['users', 'lesson_plans', 'ai_audits', 'review_notes', 'audit_logs'];
const LS_PREFIX = 'eduplan5512.tbl.';
const DB = {
  idb: null, cache: {}, engine: 'IndexedDB + LocalStorage',
  async init() {
    TABLES.forEach(t => this.cache[t] = []);
    try {
      if (!window.indexedDB) throw new Error('no idb');
      this.idb = await new Promise((res, rej) => {
        const r = indexedDB.open(DB_NAME, DB_VERSION);
        r.onupgradeneeded = () => { const db = r.result; TABLES.forEach(t => { if (!db.objectStoreNames.contains(t)) db.createObjectStore(t, { keyPath:'id' }); }); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
      for (const t of TABLES) this.cache[t] = await this._all(t);
    } catch (e) {
      this.idb = null; this.engine = 'LocalStorage (dự phòng)';
    }
    if (!this.cache.users.length) {
      const mirror = {}; let has = false;
      TABLES.forEach(t => { mirror[t] = lsGet(LS_PREFIX + t, []); if (mirror[t].length) has = true; });
      if (has) await this.replaceAll(mirror); else await this.seed();
    }
  },
  _store(t, mode) { return this.idb.transaction(t, mode).objectStore(t); },
  _all(t) { return new Promise((res, rej) => { const r = this._store(t, 'readonly').getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error); }); },
  _req(t, fn) { if (!this.idb) return Promise.resolve(); return new Promise((res, rej) => { const tx = this.idb.transaction(t, 'readwrite'); fn(tx.objectStore(t)); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); },
  _mirror(t) { lsSet(LS_PREFIX + t, this.cache[t]); },
  all(t) { return this.cache[t]; },
  get(t, id) { return this.cache[t].find(r => r.id === id); },
  where(t, fn) { return this.cache[t].filter(fn); },
  async put(t, rec) {
    const i = this.cache[t].findIndex(r => r.id === rec.id);
    if (i >= 0) this.cache[t][i] = rec; else this.cache[t].push(rec);
    this._mirror(t);
    await this._req(t, s => s.put(rec)).catch(() => {});
    return rec;
  },
  async del(t, id) { this.cache[t] = this.cache[t].filter(r => r.id !== id); this._mirror(t); await this._req(t, s => s.delete(id)).catch(() => {}); },
  async replaceAll(data) {
    for (const t of TABLES) {
      this.cache[t] = Array.isArray(data[t]) ? data[t] : [];
      this._mirror(t);
      await this._req(t, s => { s.clear(); this.cache[t].forEach(r => s.put(r)); }).catch(() => {});
    }
  },
  exportAll() { const o = { app:'EduPlan 5512 CoPilot', schema:1, exportedAt:nowISO(), tables:{} }; TABLES.forEach(t => o.tables[t] = this.cache[t]); return o; },
  sizeBytes(t) { return new Blob([JSON.stringify(t ? this.cache[t] : this.cache)]).size; },
  async seed() { await this.replaceAll(await buildSeed()); }
};

}

/* ------------------------------ 6. TOAST / MODAL ----------------------------- */
function toast(msg, type = 'info') {
  const map = { info:['bg-slate-900', 'info'], success:['bg-emerald-600', 'check-circle-2'], error:['bg-rose-600', 'alert-triangle'], warn:['bg-amber-500', 'alert-circle'] };
  const [bg, icon] = map[type] || map.info;
  const el = document.createElement('div');
  el.className = `${bg} text-white text-sm px-4 py-3 rounded-xl shadow-lg flex items-center gap-2 max-w-sm fade-in`;
  el.innerHTML = `${ic(icon)}<span>${esc(msg)}</span>`;
  $('#toast-root').appendChild(el); icons();
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = '.3s'; setTimeout(() => el.remove(), 300); }, 3200);
}
function openModal(title, body, opts = {}) {

}
function closeModal() { $('#modal-root').innerHTML = ''; }
function confirmBox(msg, onYes, yesLabel = 'Đồng ý') {

/* ------------------------------- 7. AUTH ------------------------------- */
async function login(identity, password) {
  const id = identity.trim().toLowerCase();
  const u = DB.all('users').find(x => x.email.toLowerCase() === id || x.code.toLowerCase() === id);
  if (!u) return toast('Không tìm thấy tài khoản.', 'error');
  if (u.password !== await hashPw(password)) return toast('Mật khẩu không đúng.', 'error');
  if (u.status === 'locked') return toast('Tài khoản đã bị khóa. Vui lòng liên hệ Ban Giám hiệu.', 'error');
  if (u.status === 'pending') return toast('Tài khoản đang chờ Ban Giám hiệu kích hoạt.', 'warn');
  setSession(u); await log('Đăng nhập', u.name, ROLES[u.role].label);
  toast(`Chào mừng ${u.name}!`, 'success'); render();
}
function setSession(u) { S.user = u; lsSet(SESSION_KEY, u.id); if (S.view === 'admin' && u.role !== 'admin') S.view = 'workspace'; }
async function logout() { await log('Đăng xuất', S.user?.name); S.user = null; localStorage.removeItem(SESSION_KEY); render(); }
async function register(form) {
  const f = Object.fromEntries(new FormData(form));
  if (!f.name.trim() || !f.identity.trim() || !f.password) return toast('Vui lòng nhập đủ thông tin bắt buộc.', 'warn');
  if (f.password.length < 6) return toast('Mật khẩu tối thiểu 6 ký tự.', 'warn');
  if (f.password !== f.password2) return toast('Mật khẩu xác nhận không khớp.', 'warn');
  const idt = f.identity.trim();
  if (DB.all('users').some(u => u.email.toLowerCase() === idt.toLowerCase() || u.code.toLowerCase() === idt.toLowerCase())) return toast('Email/Mã giáo viên đã tồn tại.', 'error');
  const isEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(idt);
  const u = { id:uid('u'), name:f.name.trim(), email:isEmail ? idt : idt.toLowerCase() + '@eduplan.local', code:isEmail ? 'GV-' + Math.random().toString(36).slice(2, 6).toUpperCase() : idt.toUpperCase(),
    role:f.role, dept:f.role === 'admin' ? 'Ban Giám hiệu' : f.dept, grades:f.grades || '', title:ROLES[f.role].label, password:await hashPw(f.password),
    status:f.role === 'teacher' ? 'active' : 'pending', canApprove:f.role !== 'teacher', createdAt:nowISO() };
  await DB.put('users', u);
  S.user = null; await DB.put('audit_logs', { id:uid('log'), at:nowISO(), userId:u.id, userName:u.name, role:u.role, action:'Đăng ký', target:u.email, detail:`${ROLES[u.role].label} · ${u.dept}` });
  if (u.status === 'active') { setSession(u); toast('Đăng ký thành công! Đã đăng nhập.', 'success'); render(); }
  else { toast('Đăng ký thành công. Tài khoản Tổ trưởng/BGH cần Admin kích hoạt.', 'warn'); S.authTab = 'login'; render(); }
}
const DEMO_BY_ROLE = { admin:'u1', leader:'u2', teacher:'u4' };
async function switchRole(role) {
  if (S.user?.role === role) return;
  let u = DB.get('users', DEMO_BY_ROLE[role]);
  if (!u || u.status !== 'active') u = DB.all('users').find(x => x.role === role && x.status === 'active');
  if (!u) return toast('Không có tài khoản hoạt động cho vai trò này.', 'warn');
  const from = S.user?.name;
  setSession(u);
  if (role === 'teacher' && S.view === 'admin') S.view = 'workspace';
  if (role !== 'admin' && S.view === 'admin') S.view = 'workspace';
  await log('Chuyển vai trò', u.name, `Từ ${from || '—'} → ${ROLES[role].label}`);
  toast(`Đang xem với vai trò: ${ROLES[role].label} (${u.name})`, 'info'); render();
}

/* --------------------------- 8. AI ENGINE ----------------------------- */
const RX = {
  muctieu: /I\.\s*M[ỤU]C\s*TI[ÊE]U|M[ụu]c\s*ti[êe]u\s*(b[àa]i|d[ạa]y)/i,
  thietbi: /THI[ẾE]T\s*B[ỊI]|H[ỌO]C\s*LI[ỆE]U/i,
  tientrinh: /TI[ẾE]N\s*TR[ÌI]NH/i,
  nangluc: /n[ăa]ng\s*l[ựu]c/i, phamchat: /ph[ẩa]m\s*ch[ấa]t/i,
  hd: { modau:/(M[ởo]\s*[đd][ầa]u|Kh[ởo]i\s*[đd][ộo]ng|X[áa]c\s*[đd][ịi]nh\s*v[ấa]n\s*[đd][ềe])/i, hinhthanh:/H[ìi]nh\s*th[àa]nh\s*ki[ếe]n\s*th[ứu]c/i, luyentap:/Luy[ệe]n\s*t[ậa]p/i, vandung:/V[ậa]n\s*d[ụu]ng/i },
  partA: /^\s*a\)\s*M[ụu]c\s*ti[êe]u/gim, partB: /^\s*b\)\s*N[ộo]i\s*dung/gim, partC: /^\s*c\)\s*S[ảa]n\s*ph[ẩa]m/gim, partD: /^\s*d\)\s*T[ổo]\s*ch[ứu]c/gim,
  step: [/Chuy[ểe]n\s*giao|giao\s*nhi[ệe]m\s*v[ụu]/gi, /Th[ựu]c\s*hi[ệe]n\s*nhi[ệe]m\s*v[ụu]/gi, /B[áa]o\s*c[áa]o|th[ảa]o\s*lu[ậa]n/gi, /K[ếe]t\s*lu[ậa]n|nh[ậa]n\s*[đd][ịi]nh|chu[ẩa]n\s*h[óo]a/gi],
  active: /(th[ảa]o\s*lu[ậa]n|nh[óo]m|c[ặa]p\s*[đd][ôo]i|phi[ếe]u\s*h[ọo]c\s*t[ậa]p|tr[ìi]nh\s*b[àa]y|th[ựu]c\s*h[àa]nh|th[íi]\s*nghi[ệe]m\s*theo\s*nh[óo]m|t[ựu]\s*l[àa]m\s*th[íi]\s*nghi[ệe]m|[đd][óo]ng\s*vai|tranh\s*bi[ệe]n|kh[ăa]n\s*tr[ảa]i\s*b[àa]n|m[ảa]nh\s*gh[ée]p|s[ơo]\s*[đd][ồo]\s*t[ưu]\s*duy|tr[òo]\s*ch[ơo]i|ph[òo]ng\s*tranh|tr[ạa]m|kh[áa]m\s*ph[áa]|ph[ảa]n\s*bi[ệe]n|[đd][áa]nh\s*gi[áa]\s*ch[ée]o|[đd][ổo]i\s*ch[ée]o|t[ựu]\s*[đd][áa]nh\s*gi[áa]|d[ựu]\s*[áa]n|c[ắa]t\s*gh[ée]p|[đd]o\s*[đd][ạa]c|KWL|Padlet|Quizizz|Kahoot)/gi,
  passive: /(GV\s*gi[ảa]ng|GV\s*thuy[ếe]t\s*tr[ìi]nh|GV\s*[đd][ọo]c|GV\s*gi[ảa]i\s*th[íi]ch|GV\s*gi[ớo]i\s*thi[ệe]u|GV\s*l[àa]m\s*th[íi]\s*nghi[ệe]m\s*bi[ểe]u\s*di[ễe]n|GV\s*v[ẽe]|HS\s*(l[ắa]ng\s*)?nghe|HS\s*ghi\s*ch[ée]p|ghi\s*b[àa]i|HS\s*quan\s*s[áa]t\.?$|ghi\s*nh[ớo]|ch[úu]\s*[ýy]\s*l[êe]n\s*b[ảa]ng|[đd][ọo]c\s*SGK|GV\s*g[ọo]i\s*1)/gi,
  product: /(s[ảa]n\s*ph[ẩa]m|phi[ếe]u\s*h[ọo]c\s*t[ậa]p|b[ảa]ng\s*nh[óo]m|s[ơo]\s*[đd][ồo])/i,
  time: /\d+\s*ph[úu]t/i
};
const countRx = (rx, s) => (s.match(rx) || []).length;

function mockAnalyze(text) {
  const t = text || '';
  const lines = t.split(/\r?\n/);
  const structure = [RX.muctieu.test(t), RX.thietbi.test(t), RX.tientrinh.test(t), RX.nangluc.test(t), RX.phamchat.test(t)];
  const acts = Object.values(RX.hd).map(r => r.test(t));
  const nA = countRx(RX.partA, t), nB = countRx(RX.partB, t), nC = countRx(RX.partC, t), nD = countRx(RX.partD, t);
  const nAct = Math.max(1, acts.filter(Boolean).length, nA, nD);
  const partRatio = Math.min(1, (nA + nB + nC + nD) / (4 * nAct));
  const stepCounts = RX.step.map(r => countRx(r, t));
  const stepRatio = stepCounts.map(c => Math.min(1, c / nAct));
  const act = countRx(RX.active, t), pas = countRx(RX.passive, t);
  const compliance = clamp(structure.filter(Boolean).length / 5 * 30 + acts.filter(Boolean).length / 4 * 20 + partRatio * 25 + stepRatio.reduce((a, b) => a + b, 0) / 4 * 25 - (t.trim().length < 300 ? 25 : 0));
  const activeness = clamp(t.trim().length < 50 ? 10 : 20 + 72 * act / (act + pas + 1) + (RX.time.test(t) ? 4 : 0), 5, 96);

  const passiveLines = lines.map((l, i) => ({ l: l.trim(), i })).filter(o => o.l && (o.l.match(RX.passive) || []).length);
  const ctxOf = idx => { for (let j = idx; j >= 0; j--) { const m = lines[j].match(/^(Ho[ạa]t\s*[đd][ộo]ng\s*\d[^:]*:?[^\n(]*|\d\.\d\.\s*[^\n]+)/i); if (m) return m[1].trim(); } return 'Tiến trình dạy học'; };
  const stepOf = l => { const m = l.match(/B[ưu][ớo]c\s*(\d)/i); if (m) return +m[1]; if (/g[ọo]i|tr[ảa]\s*l[ờo]i/i.test(l)) return 3; if (/ch[ốo]t|k[ếe]t\s*lu[ậa]n/i.test(l)) return 4; if (/quan\s*s[áa]t|nghe|ghi/i.test(l)) return 2; return 1; };
  const REV = {
    1: 'Bước 1. Chuyển giao nhiệm vụ: GV nêu mục tiêu, phát phiếu học tập và giao lệnh: "Trong 7 phút, làm việc nhóm 4, các em khai thác học liệu (SGK/mô hình/video) để trả lời các câu hỏi trong phiếu. Sản phẩm: phiếu học tập hoàn chỉnh trên bảng nhóm; tiêu chí: đúng – đủ – có ví dụ minh họa."',
    2: 'Bước 2. Thực hiện nhiệm vụ: HS suy nghĩ cá nhân 2 phút, sau đó thảo luận nhóm theo kĩ thuật khăn trải bàn để thống nhất sản phẩm; GV quan sát, hỗ trợ bằng câu hỏi gợi mở, không làm thay HS.',
    3: 'Bước 3. Báo cáo, thảo luận: Các nhóm trưng bày sản phẩm theo hình thức phòng tranh; GV mời 2 nhóm có kết quả khác nhau trình bày, các nhóm khác nhận xét – bổ sung – phản biện theo bảng tiêu chí; HS đánh giá chéo.',
    4: 'Bước 4. Kết luận, nhận định: GV mời HS tự rút ra kết luận, sau đó chuẩn hóa kiến thức trọng tâm, nhận xét quá trình làm việc của các nhóm và ghi nhận sự tiến bộ của HS.'
  };
  const RAT = {
    1: 'Lệnh chuyển giao cần nêu rõ hình thức, thời gian, phương tiện và sản phẩm học tập; HS được giao nhiệm vụ khám phá thay vì tiếp nhận thụ động.',
    2: 'Chuyển HS từ nghe – ghi chép sang trực tiếp thực hiện nhiệm vụ; GV đóng vai trò người tổ chức, hỗ trợ.',
    3: 'Tăng tỉ lệ HS tham gia báo cáo, hình thành năng lực giao tiếp và tự đánh giá, đánh giá đồng đẳng.',
    4: 'Kết luận cần kết hợp đánh giá quá trình và chuẩn hóa kiến thức, để HS tự khái quát trước.'
  };
  const suggestions = passiveLines.slice(0, 4).map(o => {
    const st = stepOf(o.l); const prefix = (o.l.match(/^[-–•]\s*/) || [''])[0];
    return { activity: `${ctxOf(o.i)} — Bước ${st}`, original: o.l, revised: prefix + REV[st], rationale: RAT[st] };
  });
  if (!suggestions.length && t.trim()) suggestions.push({ activity:'Hoạt động Vận dụng', original:'', revised:'Bổ sung nhiệm vụ vận dụng gắn với thực tiễn: "Mỗi nhóm đề xuất một tình huống trong đời sống có sử dụng kiến thức bài học, trình bày giải pháp trong 1 trang A4 hoặc video 60 giây; nộp trên Padlet lớp và bình chọn sản phẩm xuất sắc."', rationale:'Phát triển năng lực vận dụng và giải quyết vấn đề thực tiễn; tạo sản phẩm học tập có thể đánh giá.' });

  const passIn = k => stepRatio[k] >= 0.75;
  const pasStep = s => passiveLines.filter(o => stepOf(o.l) === s).length;
  const steps = [
    { step:1, status: passIn(0) && pasStep(1) === 0 && RX.product.test(t) ? 'Đạt' : 'Cần điều chỉnh', analysis: passIn(0) ? (pasStep(1) ? `Có ${pasStep(1)} lệnh chuyển giao mang tính áp đặt (giảng, yêu cầu ghi nhớ/đọc SGK), chưa nêu rõ sản phẩm và tiêu chí.` : 'Lệnh chuyển giao thể hiện được mục tiêu, phương tiện và sản phẩm học tập.') : `Chỉ phát hiện ${stepCounts[0]}/${nAct} hoạt động có bước chuyển giao nhiệm vụ rõ ràng.` },
    { step:2, status: passIn(1) && pasStep(2) === 0 && act >= 3 ? 'Đạt' : 'Cần điều chỉnh', analysis: act >= 3 && pasStep(2) === 0 ? `Có ${act} dấu hiệu HS chủ động (nhóm, thảo luận, thực hành…).` : `Phát hiện ${pas} dấu hiệu GV độc thoại / HS thụ động (nghe, ghi chép, quan sát) so với ${act} dấu hiệu học tập tích cực.` },
    { step:3, status: passIn(2) && pasStep(3) === 0 ? 'Đạt' : 'Cần điều chỉnh', analysis: passIn(2) ? (pasStep(3) ? 'Báo cáo chủ yếu do GV gọi cá nhân, tỉ lệ HS tham gia thấp.' : 'Có tổ chức báo cáo, thảo luận dựa trên sản phẩm học tập.') : `Chỉ ${stepCounts[2]}/${nAct} hoạt động có bước báo cáo, thảo luận.` },
    { step:4, status: passIn(3) ? 'Đạt' : 'Cần điều chỉnh', analysis: passIn(3) ? 'Có kết luận, nhận định và chuẩn hóa kiến thức.' : `Chỉ ${stepCounts[3]}/${nAct} hoạt động có bước kết luận, nhận định.` }
  ];
  const strengths = [], weaknesses = [], solutions = [];
  structure[0] && structure[3] ? strengths.push('Có mục tiêu theo định hướng phát triển năng lực' + (structure[4] ? ', phẩm chất.' : '.')) : weaknesses.push('Mục tiêu chưa thể hiện rõ năng lực/phẩm chất theo Chương trình GDPT 2018.');
  structure[1] ? strengths.push('Có chuẩn bị thiết bị dạy học và học liệu.') : weaknesses.push('Thiếu mục "Thiết bị dạy học và học liệu".');
  acts.every(Boolean) ? strengths.push('Tiến trình đủ 4 hoạt động: Mở đầu – Hình thành kiến thức – Luyện tập – Vận dụng.') : weaknesses.push('Tiến trình chưa đủ 4 hoạt động theo Phụ lục IV CV 5512.');
  partRatio >= 0.9 ? strengths.push('Mỗi hoạt động có đủ Mục tiêu – Nội dung – Sản phẩm – Tổ chức thực hiện.') : weaknesses.push(`Một số hoạt động thiếu thành phần a) b) c) d) (phát hiện: ${nA} mục tiêu, ${nB} nội dung, ${nC} sản phẩm, ${nD} tổ chức thực hiện).`);
  if (act >= 4) strengths.push(`Sử dụng nhiều hình thức học tập tích cực (${act} dấu hiệu).`);
  if (pas > 0) weaknesses.push(`Còn ${pas} dấu hiệu GV thuyết trình, HS thụ động nghe – ghi chép.`);
  if (pas > 0) solutions.push('Viết lại lệnh chuyển giao theo cấu trúc: Nhiệm vụ – Hình thức – Thời gian – Phương tiện – Sản phẩm – Tiêu chí.');
  if (partRatio < 0.9) solutions.push('Bổ sung đầy đủ thành phần "Sản phẩm" cho từng hoạt động để làm căn cứ đánh giá.');
  if (steps.some(s => s.status !== 'Đạt')) solutions.push('Chuẩn hóa 4 bước tổ chức thực hiện cho tất cả hoạt động; ưu tiên báo cáo bằng sản phẩm nhóm.');
  if (!solutions.length) solutions.push('Duy trì thiết kế; bổ sung rubric đánh giá và học liệu số để lan tỏa trong sinh hoạt chuyên môn.');
  const summary = t.trim() ? `Mock AI Sư phạm (phân tích Regex theo Phụ lục IV CV 5512): Chỉ số tuân thủ ${compliance}%, tích cực hóa HS ${activeness}%. ${pas > act ? 'KHBD còn nặng về GV truyền thụ — cần tăng hoạt động khám phá của HS.' : 'KHBD có định hướng HS làm trung tâm; tiếp tục chuẩn hóa các bước tổ chức.'}` : 'Chưa có nội dung để phân tích.';
  return { compliance, activeness, summary, steps, strengths, weaknesses, solutions, suggestions };
}

async function geminiAnalyze(text, meta) {
  const prompt = `Bạn là chuyên gia quản lý chuyên môn của Sở GD&ĐT, am hiểu Công văn 5512/BGDĐT-GDTrH (Phụ lục IV - Khung kế hoạch bài dạy) và Chương trình GDPT 2018.
Hãy rà soát Kế hoạch bài dạy sau (Môn: ${meta.subject}, Lớp: ${meta.grade}, Bộ sách: ${meta.book}, Bài: ${meta.title}).
Tiêu chí: cấu trúc (Mục tiêu - Thiết bị dạy học và học liệu - Tiến trình 4 hoạt động; mỗi hoạt động có a) Mục tiêu b) Nội dung c) Sản phẩm d) Tổ chức thực hiện) và 4 bước tổ chức hoạt động (Chuyển giao nhiệm vụ; Thực hiện nhiệm vụ; Báo cáo, thảo luận; Kết luận, nhận định). Đánh giá mức độ học sinh làm trung tâm.
Chỉ trả về JSON hợp lệ, KHÔNG markdown, theo cấu trúc:
{"compliance":số 0-100,"activeness":số 0-100,"summary":"nhận định tổng quát 2-3 câu","steps":[{"step":1,"status":"Đạt" hoặc "Cần điều chỉnh","analysis":"..."},{"step":2,...},{"step":3,...},{"step":4,...}],"strengths":["..."],"weaknesses":["..."],"solutions":["..."],"suggestions":[{"activity":"tên hoạt động - bước","original":"trích NGUYÊN VĂN một dòng lệnh trong KHBD cần sửa","revised":"lệnh chuyển giao viết lại, HS làm trung tâm, nêu rõ nhiệm vụ - hình thức - thời gian - phương tiện - sản phẩm","rationale":"lý do sư phạm"}]}
Đưa 2-4 đề xuất. Viết tiếng Việt sư phạm chuẩn mực.

KẾ HOẠCH BÀI DẠY:
"""
${text}
"""`;
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(S.settings.model)}:generateContent`;
  const res = await fetch(url, { method:'POST', headers:{ 'Content-Type':'application/json', 'x-goog-api-key':S.settings.apiKey },
    body: JSON.stringify({ contents:[{ role:'user', parts:[{ text:prompt }] }], generationConfig:{ temperature:0.4, responseMimeType:'application/json' } }) });
  if (!res.ok) { let m = res.status + ''; try { m = (await res.json()).error?.message || m; } catch {} throw new Error(m); }
  const data = await res.json();
  const raw = data.candidates?.[0]?.content?.parts?.map(p => p.text).join('') || '';
  const json = JSON.parse(raw.replace(/^```(json)?|```$/g, '').trim());
  const arr = v => Array.isArray(v) ? v.map(String) : [];
  const steps = [1, 2, 3, 4].map(n => { const s = (json.steps || []).find(x => +x.step === n) || {}; return { step:n, status: /^đạt$/i.test(String(s.status || '').trim()) ? 'Đạt' : 'Cần điều chỉnh', analysis:String(s.analysis || '—') }; });
  return { compliance:clamp(+json.compliance || 0), activeness:clamp(+json.activeness || 0), summary:String(json.summary || ''), steps,
    strengths:arr(json.strengths), weaknesses:arr(json.weaknesses), solutions:arr(json.solutions),
    suggestions:(json.suggestions || []).map(s => ({ activity:String(s.activity || ''), original:String(s.original || ''), revised:String(s.revised || ''), rationale:String(s.rationale || '') })) };
}

async function runAnalysis() {
  const content = $('#ws-content')?.value ?? S.ws.content;
  S.ws.content = content; readWsMeta();
  if (content.trim().length < 30) return toast('Vui lòng dán nội dung kế hoạch bài dạy (tối thiểu 30 ký tự).', 'warn');
  S.ws.running = true; renderWsResult();
  let result, engine;
  const sample = S.ws.sampleKey && SAMPLES[S.ws.sampleKey]?.content === content ? S.ws.sampleKey : null;
  try {
    if (aiMode() === 'gemini') { result = await geminiAnalyze(content, S.ws.meta); engine = 'Google ' + S.settings.model; }
    else { await new Promise(r => setTimeout(r, 900)); result = sample ? JSON.parse(JSON.stringify(PRESET_AUDITS[sample])) : mockAnalyze(content); engine = 'Mock AI Sư phạm'; }
  } catch (e) {
    toast('Gemini lỗi: ' + e.message + ' — chuyển sang Mock AI.', 'error');
    result = sample ? JSON.parse(JSON.stringify(PRESET_AUDITS[sample])) : mockAnalyze(content); engine = 'Mock AI Sư phạm (dự phòng)';
  }
  S.ws.audit = { ...result, engine, at:nowISO(), by:S.user.name, saved:false };
  S.ws.running = false;
  await log('Chạy phân tích AI', S.ws.meta.title || '(chưa đặt tên)', `${engine} · Chuẩn 5512: ${result.compliance}% · Tích cực: ${result.activeness}%`);
  renderWsResult(); toast('Đã hoàn tất rà soát 5512.', 'success');
}

const scoreColor = v => v >= 85 ? '#059669' : v >= 70 ? '#2563eb' : v >= 50 ? '#d97706' : '#e11d48';
const scoreLabel = v => v >= 85 ? 'Tốt' : v >= 70 ? 'Khá' : v >= 50 ? 'Trung bình' : 'Cần cải thiện';
function gauge(value, label, sub) {
  const r = 52, c = 2 * Math.PI * r, off = c * (1 - value / 100), col = scoreColor(value);
  return `<div class="card p-4 flex items-center gap-4">
    <svg viewBox="0 0 128 128" class="w-28 h-28 shrink-0 -rotate-90">
      <circle cx="64" cy="64" r="${r}" fill="none" stroke="#e2e8f0" stroke-width="12"/>
      <circle cx="64" cy="64" r="${r}" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset 1s ease"/>
      <text x="64" y="64" transform="rotate(90 64 64)" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="800" fill="${col}">${value}%</text>
    </svg>
    <div><div class="text-sm font-bold text-slate-800">${label}</div><div class="badge mt-1" style="background:${col}1a;color:${col}">${scoreLabel(value)}</div>
    <div class="text-xs text-slate-500 mt-1.5">${sub}</div></div></div>`;
}

function applySuggestion(i, silent) {
  const s = S.ws.audit.suggestions[i]; const ta = $('#ws-content'); if (!ta || !s.original) return false;
  if (!ta.value.includes(s.original)) { if (!silent) toast('Không tìm thấy đoạn gốc trong bài (có thể đã được sửa).', 'warn'); return false; }
  ta.value = ta.value.replace(s.original, s.revised); S.ws.content = ta.value; S.ws.dirty = true; S.ws.sampleKey = null;
  $('#ws-count').textContent = ta.value.length.toLocaleString('vi-VN') + ' ký tự';
  if (!silent) toast('Đã áp dụng đề xuất vào KHBD. Hãy chạy lại AI để cập nhật chỉ số.', 'success');
  return true;
}
function applyAllSuggestions() { let n = 0; S.ws.audit.suggestions.forEach((_, i) => { if (applySuggestion(i, true)) n++; }); toast(n ? `Đã áp dụng ${n} đề xuất. Chạy lại AI để đo chỉ số mới.` : 'Không còn đoạn nào cần thay thế.', n ? 'success' : 'warn'); }
async function copySuggestion(i) { const s = S.ws.audit.suggestions[i]; await copyText(s.revised) ? toast('Đã sao chép lệnh tinh chỉnh.', 'success') : toast('Không thể sao chép.', 'error'); }

async function savePlan(submit) {
  saveWsDraftState();
  const m = S.ws.meta, a = S.ws.audit;
  if (!m.title) return toast('Vui lòng nhập Tên bài dạy.', 'warn');
  if (S.ws.content.trim().length < 30) return toast('Nội dung KHBD quá ngắn.', 'warn');
  if (submit && !a) return toast('Vui lòng chạy AI rà soát trước khi gửi duyệt.', 'warn');
  let plan = S.ws.planId ? DB.get('lesson_plans', S.ws.planId) : null;
  const u = S.user;
  if (plan && !(plan.teacherId === u.id || u.role === 'admin' || (u.role === 'leader' && plan.dept === u.dept))) plan = null;
  const now = nowISO();
  if (!plan) {
    plan = { id:uid('lp'), ...m, dept:SUBJECTS[m.subject] || u.dept, schoolYear:SCHOOL_YEAR, teacherId:u.id, teacherName:u.name, content:S.ws.content,
      status:'draft', createdAt:now, updatedAt:now, submittedAt:null, ttSignedBy:null, ttSignedAt:null, bghSignedBy:null, bghSignedAt:null, onTime:true, versions:[] };
  }
  const last = plan.versions[plan.versions.length - 1];
  const changed = !last || last.content !== S.ws.content;
  plan = { ...plan, ...m, dept:SUBJECTS[m.subject] || plan.dept, content:S.ws.content, updatedAt:now };
  if (changed) plan.versions = [...plan.versions, { v:plan.versions.length + 1, at:now, by:u.name, note:plan.versions.length ? 'Cập nhật nội dung sau rà soát AI' : 'Tạo mới', content:S.ws.content, score:a ? a.compliance : null }];
  else if (a && last) last.score = a.compliance;
  if (submit) { plan.status = 'pending'; plan.submittedAt = now; plan.ttSignedBy = null; plan.ttSignedAt = null; plan.bghSignedBy = null; plan.bghSignedAt = null; }
  await DB.put('lesson_plans', plan);
  if (a && !a.saved) {
    await DB.put('ai_audits', { id:uid('a'), planId:plan.id, version:plan.versions.length, at:a.at, by:a.by, engine:a.engine, compliance:a.compliance, activeness:a.activeness, summary:a.summary, steps:a.steps, strengths:a.strengths, weaknesses:a.weaknesses, solutions:a.solutions, suggestions:a.suggestions });
    a.saved = true;
  }
  S.ws.planId = plan.id; S.ws.dirty = false;
  await log(submit ? 'Nộp bài' : 'Lưu CSDL', plan.title, submit ? `Gửi Tổ trưởng duyệt · phiên bản ${plan.versions.length}` : `Lưu phiên bản ${plan.versions.length}`);
  toast(submit ? 'Đã gửi Tổ trưởng chuyên môn duyệt!' : 'Đã lưu vào cơ sở dữ liệu trường.', 'success');
  render();
}

function optimizedContent(content, audit) {
  let out = content; const appended = [];
  (audit?.suggestions || []).forEach(s => { if (s.original && out.includes(s.original)) out = out.replace(s.original, s.revised); else if (s.revised && !out.includes(s.revised)) appended.push(s); });
  return { out, appended };
}
function wordDoc(title, bodyHtml) {
  return `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>${esc(title)}</title>
  <style>body{font-family:"Times New Roman";font-size:13pt;line-height:1.4} h1{font-size:15pt;text-align:center} h2{font-size:13pt} pre{font-family:"Times New Roman";white-space:pre-wrap;font-size:13pt} .note{color:#1e40af}</style></head><body>${bodyHtml}</body></html>`;
}
async function exportOptimized(planId) {

  else { saveWsDraftState(); meta = S.ws.meta; content = S.ws.content; audit = S.ws.audit; teacher = S.user.name; }
  if (!content?.trim()) return toast('Chưa có nội dung để xuất.', 'warn');
  const { out, appended } = optimizedContent(content, audit);
  const body = `<p style="text-align:center"><b>${esc(S.settings.school)}</b></p><h1>KẾ HOẠCH BÀI DẠY (BẢN ĐÃ TỐI ƯU THEO CV 5512)</h1>

    ${audit ? `<p class="note">Kết quả rà soát: Chuẩn 5512 ${audit.compliance}% · Tích cực hóa HS ${audit.activeness}% · ${esc(audit.engine)}</p>` : ''}
    <pre>${esc(out)}</pre>
    ${appended.length ? `<h2>PHỤ LỤC — ĐỀ XUẤT TINH CHỈNH BỔ SUNG</h2>${appended.map(s => `<p><b>${esc(s.activity)}:</b> ${esc(s.revised)}<br><i>${esc(s.rationale)}</i></p>`).join('')}` : ''}
    <p style="margin-top:24pt"><i>Xuất từ EduPlan 5512 CoPilot ngày ${fmtDT(nowISO())}</i></p>`;
  download(`KHBD_toi-uu_${slug(meta.title)}.doc`, wordDoc(meta.title, body), 'application/msword');
  await log('Xuất báo cáo', meta.title, 'Tải KHBD đã tối ưu (.doc)');
  toast('Đã xuất bài dạy hoàn thiện (.doc mở bằng Word).', 'success');
}
const slug = s => String(s || 'bai-day').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60);
const statusBadge = st => { const s = STATUSES[st] || STATUSES.draft; return `<span class="badge ${s.cls}">${ic(s.icon, 'w-3 h-3')}${s.label}</span>`; };

async function submitReview() {
  if (!can.approve()) return toast('Tài khoản chưa có quyền ký duyệt.', 'error');
  const n = { id:uid('r'), reviewerId:S.user.id, ...noteFromForm() };
  const p = DB.get('lesson_plans', n.planId); if (!p) return;
  await DB.put('review_notes', n);

  else if (S.user.role === 'leader') { p.status = 'pending'; p.ttSignedBy = S.user.name; p.ttSignedAt = now; action = 'Ký duyệt cấp tổ'; }
  else { p.status = 'approved'; p.bghSignedBy = S.user.name; p.bghSignedAt = now; action = 'Phê duyệt'; }
  p.updatedAt = now; await DB.put('lesson_plans', p);
  await log(action, p.title, `${n.level}: ${n.verdict}`);
  toast(action === 'Phê duyệt' ? 'Đã phê duyệt: KHBD đạt chuẩn.' : action === 'Ký duyệt cấp tổ' ? 'Đã ký duyệt cấp tổ — chuyển Ban Giám hiệu.' : 'Đã gửi yêu cầu chỉnh sửa cho giáo viên.', 'success');
  S.review.form = buildReviewForm(p.id); render();
}

function computeStats() {
  const plans = DB.all('lesson_plans').filter(p => p.status !== 'draft');
  const byDept = DEPTS.map(d => {
    const live = plans.filter(p => p.dept === d); const b = BASELINE[d];
    const scores = live.map(p => latestAudit(p.id)?.compliance).filter(x => x != null);
    const submitted = b.submitted + live.length, approved = b.approved + live.filter(p => p.status === 'approved').length;
    const avgScore = scores.length ? (b.avg * b.submitted + scores.reduce((x, y) => x + y, 0)) / (b.submitted + scores.length) : b.avg;
    return { dept:d, submitted, approved, rate: submitted ? approved / submitted * 100 : 0, avg: avgScore, live: live.length, pending: live.filter(p => p.status === 'pending').length, revise: live.filter(p => p.status === 'revise').length };
  });
  const submitted = byDept.reduce((a, b) => a + b.submitted, 0), approved = byDept.reduce((a, b) => a + b.approved, 0);
  const teachers = DB.all('users').filter(u => u.role === 'teacher' && u.status === 'active');
  const onTimeLive = teachers.filter(t => plans.some(p => p.teacherId === t.id && p.onTime !== false)).length;
  const onTime = (BASELINE_TEACHERS.onTime + onTimeLive) / (BASELINE_TEACHERS.total + teachers.length) * 100;
  const liveScores = plans.map(p => latestAudit(p.id)?.compliance).filter(x => x != null);
  return { byDept, submitted, approved, rate: approved / submitted * 100, onTime, teachersTotal: BASELINE_TEACHERS.total + teachers.length, onTimeCount: BASELINE_TEACHERS.onTime + onTimeLive,
    live: plans.length, liveApproved: plans.filter(p => p.status === 'approved').length, livePending: plans.filter(p => p.status === 'pending').length, liveRevise: plans.filter(p => p.status === 'revise').length,
    liveAvg: avg(liveScores), liveAct: avg(plans.map(p => latestAudit(p.id)?.activeness).filter(x => x != null)) };
}

      <td class="text-right whitespace-nowrap">${u.id === S.user.id ? '<span class="text-xs text-slate-400">Tài khoản hiện tại</span>' : u.status === 'pending' ? `<button class="btn btn-success !py-1 !px-2 text-xs" onclick="setUserStatus('${u.id}','active')">${ic('user-check', 'w-3.5 h-3.5')}Kích hoạt</button>` : u.status === 'active' ? `<button class="btn btn-danger !py-1 !px-2 text-xs" onclick="setUserStatus('${u.id}','locked')">${ic('lock', 'w-3.5 h-3.5')}Khóa</button>` : `<button class="btn btn-soft !py-1 !px-2 text-xs" onclick="setUserStatus('${u.id}','active')">${ic('unlock', 'w-3.5 h-3.5')}Mở khóa</button>`}
        ${u.id !== S.user.id ? `<button class="btn btn-ghost !py-1 !px-2 text-xs" title="Đặt lại mật khẩu 123456" onclick="resetPw('${u.id}')">${ic('key-round', 'w-3.5 h-3.5')}</button>` : ''}</td></tr>`).join('')}
    </tbody></table></div>
  </div>
  <div class="grid xl:grid-cols-3 gap-5">
    <div class="card overflow-hidden xl:col-span-2">
      <div class="px-4 py-3 border-b border-slate-100 flex flex-wrap gap-2 items-center justify-between"><h3 class="font-bold flex items-center gap-2">${ic('scroll-text', 'w-4 h-4 text-brand-600')}Nhật ký hoạt động (Audit Logs) <span class="flex items-center gap-1 text-[11px] font-semibold text-emerald-600"><span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>thời gian thực</span></h3>
        <div class="relative"><span class="absolute left-2.5 top-2 text-slate-400">${ic('search', 'w-3.5 h-3.5')}</span><input class="input !py-1.5 !pl-8 !text-xs w-56" placeholder="Lọc người dùng, thao tác..." value="${esc(S.logQ)}" oninput="S.logQ=this.value;renderLogs()"></div></div>
      <div class="max-h-[420px] overflow-y-auto scroll-thin"><table class="w-full tbl"><thead class="sticky top-0"><tr><th>Thời gian</th><th>Người thực hiện</th><th>Thao tác</th><th>Đối tượng</th><th>Chi tiết</th></tr></thead><tbody id="log-body"></tbody></table></div>
    </div>
    <div class="card p-5 space-y-4">
      <h3 class="font-bold flex items-center gap-2">${ic('database', 'w-4 h-4 text-brand-600')}Quản trị Database</h3>
      <div class="text-xs space-y-1.5">
        <div class="flex justify-between"><span class="text-slate-500">Engine lưu trữ</span><b>${esc(DB.engine)}</b></div>
        <div class="flex justify-between"><span class="text-slate-500">Dung lượng dữ liệu</span><b>${fmtBytes(total)}</b></div>
        <div class="flex justify-between"><span class="text-slate-500">Hạn mức trình duyệt</span><b id="storage-est">đang đo…</b></div>
      </div>
      <div class="space-y-1.5">${TABLES.map(t => { const sz = DB.sizeBytes(t); return `<div class="text-xs"><div class="flex justify-between"><code class="text-brand-700">${t}</code><span>${DB.all(t).length} dòng · ${fmtBytes(sz)}</span></div><div class="h-1.5 rounded-full bg-slate-100 mt-0.5"><div class="h-1.5 rounded-full bg-brand-500" style="width:${Math.max(2, sz / total * 100)}%"></div></div></div>`; }).join('')}</div>
      <div class="border-t border-slate-100 pt-4 space-y-2">
        <div class="label">Sao lưu & khôi phục</div>
        <button class="btn btn-primary w-full" onclick="exportJSON()">${ic('download')}Sao lưu Database (JSON)</button>
        <div class="flex gap-2"><select class="input !text-xs" onchange="S.exportTable=this.value">${TABLES.map(t => `<option ${S.exportTable === t ? 'selected' : ''}>${t}</option>`).join('')}</select>
          <button class="btn btn-ghost" onclick="exportCSV(S.exportTable)">${ic('sheet')}CSV</button></div>
        <label class="btn btn-soft w-full cursor-pointer">${ic('upload')}Khôi phục Database (Import JSON)<input type="file" accept=".json,application/json" class="hidden" onchange="importJSON(this)"></label>
        <button class="btn btn-danger w-full" onclick="resetDB()">${ic('refresh-ccw')}Khôi phục dữ liệu mẫu ban đầu</button>
      </div>
    </div>
  </div>`;
}
function deptChart(rows) {
  return `<div class="space-y-4">${rows.map(d => `<div>
    <div class="flex justify-between text-sm mb-1"><span class="font-semibold">${d.dept}</span><span class="text-xs text-slate-500">${d.approved}/${d.submitted} đạt · TB ${d.avg.toFixed(1)}%</span></div>
    <div class="relative h-4 rounded-full bg-slate-100 overflow-hidden"><div class="h-4 rounded-full bg-gradient-to-r from-brand-700 to-brand-500 transition-all duration-700" style="width:${d.rate}%"></div>
      <span class="absolute right-2 top-0 text-[10px] font-bold leading-4 ${d.rate > 90 ? 'text-white' : 'text-slate-600'}">${d.rate.toFixed(1)}%</span></div>
    <div class="h-2 rounded-full bg-slate-50 mt-1 overflow-hidden"><div class="h-2 rounded-full bg-sky-300" style="width:${d.avg}%"></div></div></div>`).join('')}
    <div class="flex justify-between text-[10px] text-slate-400 pt-1"><span>0%</span><span>25%</span><span>50%</span><span>75%</span><span>100%</span></div></div>`;
}
function statusDonut() {
  const plans = DB.all('lesson_plans'); const keys = Object.keys(STATUSES); const colors = { draft:'#94a3b8', pending:'#f59e0b', revise:'#e11d48', approved:'#059669' };
  const counts = keys.map(k => plans.filter(p => p.status === k).length); const tot = counts.reduce((a, b) => a + b, 0) || 1;
  let acc = 0; const r = 40, c = 2 * Math.PI * r;
  const arcs = counts.map((n, i) => { const len = n / tot * c; const s = `<circle cx="60" cy="60" r="${r}" fill="none" stroke="${colors[keys[i]]}" stroke-width="18" stroke-dasharray="${len} ${c - len}" stroke-dashoffset="${-acc}"/>`; acc += len; return n ? s : ''; }).join('');
  return `<div class="flex items-center gap-4"><svg viewBox="0 0 120 120" class="w-32 h-32 -rotate-90"><circle cx="60" cy="60" r="${r}" fill="none" stroke="#f1f5f9" stroke-width="18"/>${arcs}
    <text x="60" y="60" transform="rotate(90 60 60)" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="800" fill="#0f172a">${plans.length}</text></svg>
    <ul class="text-xs space-y-1.5">${keys.map((k, i) => `<li class="flex items-center gap-2"><span class="w-3 h-3 rounded" style="background:${colors[k]}"></span>${STATUSES[k].label}: <b>${counts[i]}</b></li>`).join('')}</ul></div>`;
}
function insight(st) {
  const low = [...st.byDept].sort((a, b) => a.rate - b.rate)[0];
  const parts = [`Tổ <b>${low.dept}</b> có tỷ lệ đạt chuẩn thấp nhất (${low.rate.toFixed(1)}%) — ưu tiên dự giờ, sinh hoạt chuyên môn theo nghiên cứu bài học.`];
  if (st.livePending) parts.push(`Còn <b>${st.livePending}</b> hồ sơ chờ duyệt.`);
  if (st.rate < 90) parts.push(`Cần thêm khoảng <b>${Math.ceil(0.9 * st.submitted - st.approved)}</b> giáo án đạt chuẩn để chạm mục tiêu 90%.`);
  return parts.join(' ');
}
function renderLogs() {
  const body = $('#log-body'); if (!body) return;
  const q = S.logQ.trim().toLowerCase();
  const list = DB.all('audit_logs').filter(l => !q || [l.userName, l.action, l.target, l.detail].join(' ').toLowerCase().includes(q)).sort((a, b) => b.at.localeCompare(a.at)).slice(0, 300);
  const actColor = a => /Phê duyệt|Ký duyệt/.test(a) ? 'bg-emerald-100 text-emerald-700' : /chỉnh sửa|Xóa|Khóa/.test(a) ? 'bg-rose-100 text-rose-700' : /AI/.test(a) ? 'bg-violet-100 text-violet-700' : /Nộp|Lưu/.test(a) ? 'bg-brand-100 text-brand-700' : /Xuất|Sao lưu|Khôi phục/.test(a) ? 'bg-amber-100 text-amber-700' : 'bg-slate-100 text-slate-600';
  body.innerHTML = list.map(l => `<tr><td class="whitespace-nowrap text-xs">${fmtDT(l.at)}</td><td><div class="font-semibold text-xs">${esc(l.userName)}</div><div class="text-[10px] text-slate-500">${esc(ROLES[l.role]?.short || l.role)}</div></td>
    <td><span class="badge ${actColor(l.action)}">${esc(l.action)}</span></td><td class="text-xs max-w-[220px]">${esc(l.target)}</td><td class="text-xs text-slate-500 max-w-[260px]">${esc(l.detail)}</td></tr>`).join('') || '<tr><td colspan="5" class="text-center py-6 text-slate-500">Không có bản ghi.</td></tr>';
}
const fmtBytes = b => b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(1) + ' KB' : (b / 1048576).toFixed(2) + ' MB';
async function updateStorageEstimate() { const el = $('#storage-est'); if (!el) return; try { const e = await navigator.storage.estimate(); el.textContent = `${fmtBytes(e.usage || 0)} / ${fmtBytes(e.quota || 0)}`; } catch { el.textContent = 'Không hỗ trợ'; } }
async function setUserRole(id, role) { const u = DB.get('users', id); const old = u.role; u.role = role; u.title = ROLES[role].label; if (role === 'admin') u.dept = 'Ban Giám hiệu'; else if (u.dept === 'Ban Giám hiệu') u.dept = 'Toán'; u.canApprove = role !== 'teacher'; await DB.put('users', u); await log('Phân quyền', u.name, `${ROLES[old].short} → ${ROLES[role].short}`); toast('Đã cập nhật vai trò.', 'success'); render(); }
async function toggleApprove(id, v) { const u = DB.get('users', id); u.canApprove = v; await DB.put('users', u); await log('Phân quyền', u.name, v ? 'Cấp quyền duyệt' : 'Thu hồi quyền duyệt'); toast('Đã cập nhật quyền duyệt.', 'success'); render(); }
async function setUserStatus(id, status) { const u = DB.get('users', id); u.status = status; await DB.put('users', u); await log(status === 'locked' ? 'Khóa tài khoản' : 'Kích hoạt tài khoản', u.name, u.email); toast(status === 'locked' ? 'Đã khóa tài khoản.' : 'Đã kích hoạt tài khoản.', 'success'); render(); }
function resetPw(id) { const u = DB.get('users', id); confirmBox(`Đặt lại mật khẩu của ${u.name} về 123456?`, async () => { u.password = await hashPw('123456'); await DB.put('users', u); await log('Đặt lại mật khẩu', u.name, ''); toast('Đã đặt lại mật khẩu.', 'success'); }); }

/* ------------------------ SAO LƯU / KHÔI PHỤC ------------------------ */
async function exportJSON() {
  const data = DB.exportAll(); data.tables.users = data.tables.users.map(u => ({ ...u }));
  download(`EduPlan5512_backup_${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(data, null, 2), 'application/json');
  await log('Sao lưu', 'Toàn bộ CSDL', `${TABLES.map(t => `${t}:${DB.all(t).length}`).join(', ')}`); toast('Đã xuất bản sao lưu JSON.', 'success');
}
function toCSV(rows, cols) {
  const cell = v => { v = v == null ? '' : typeof v === 'object' ? JSON.stringify(v) : String(v); return /[",\n;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  return '﻿' + [cols.join(','), ...rows.map(r => cols.map(c => cell(r[c])).join(','))].join('\r\n');
}
async function exportCSV(table, rowsIn) {
  let rows = (rowsIn || DB.all(table)).map(r => ({ ...r }));
  if (table === 'users') rows = rows.map(({ password, ...r }) => r);
  if (table === 'lesson_plans') rows = rows.map(p => ({ id:p.id, title:p.title, subject:p.subject, grade:p.grade, book:p.book, term:p.term, dept:p.dept, teacherName:p.teacherName, status:STATUSES[p.status]?.label, submittedAt:p.submittedAt, versions:p.versions.length, score5512:latestAudit(p.id)?.compliance ?? '', activeness:latestAudit(p.id)?.activeness ?? '', ttSignedBy:p.ttSignedBy || '', bghSignedBy:p.bghSignedBy || '', onTime:p.onTime === false ? 'Quá hạn' : 'Đúng hạn' }));
  if (!rows.length) return toast('Bảng không có dữ liệu.', 'warn');
  const cols = [...new Set(rows.flatMap(r => Object.keys(r)))];
  download(`EduPlan5512_${table}_${new Date().toISOString().slice(0, 10)}.csv`, toCSV(rows, cols), 'text/csv;charset=utf-8');
  await log('Xuất báo cáo', table, `CSV ${rows.length} dòng`); toast(`Đã xuất ${rows.length} dòng CSV.`, 'success');
}
async function exportReportCSV() {
  const st = computeStats();
  const rows = st.byDept.map(d => ({ 'Tổ chuyên môn':d.dept, 'Số KHBD đã nộp':d.submitted, 'Số KHBD đạt chuẩn':d.approved, 'Tỷ lệ đạt (%)':d.rate.toFixed(1), 'Điểm 5512 TB (%)':d.avg.toFixed(1), 'Chờ duyệt':d.pending, 'Yêu cầu chỉnh sửa':d.revise }));
  rows.push({ 'Tổ chuyên môn':'TOÀN TRƯỜNG', 'Số KHBD đã nộp':st.submitted, 'Số KHBD đạt chuẩn':st.approved, 'Tỷ lệ đạt (%)':st.rate.toFixed(1), 'Điểm 5512 TB (%)':avg(st.byDept.map(d => d.avg)), 'Chờ duyệt':st.livePending, 'Yêu cầu chỉnh sửa':st.liveRevise });
  download(`BaoCao_KHBD_5512_${slug(S.settings.school)}_${new Date().toISOString().slice(0, 10)}.csv`, toCSV(rows, Object.keys(rows[0])), 'text/csv;charset=utf-8');
  await log('Xuất báo cáo', 'Báo cáo Phòng/Sở GD&ĐT', `Tỷ lệ đạt chuẩn ${st.rate.toFixed(1)}%`); toast('Đã xuất báo cáo tổng hợp CSV.', 'success');
}
function importJSON(input) {
  const f = input.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result); const tables = d.tables || d;
      if (!TABLES.every(t => Array.isArray(tables[t]))) throw new Error('Tệp không đúng cấu trúc 5 bảng của EduPlan 5512.');
      confirmBox(`Khôi phục từ "${f.name}"? Dữ liệu hiện tại sẽ được thay thế (${TABLES.map(t => `${t}: ${tables[t].length}`).join(' · ')}).`, async () => {
        const me = S.user;
        await DB.replaceAll(tables);
        S.user = DB.get('users', me.id) || DB.all('users').find(u => u.role === 'admin' && u.status === 'active') || null;
        if (S.user) { lsSet(SESSION_KEY, S.user.id); await log('Khôi phục', f.name, 'Import JSON thành công'); } else localStorage.removeItem(SESSION_KEY);
        toast('Khôi phục cơ sở dữ liệu thành công.', 'success'); render();
      }, 'Khôi phục');
    } catch (e) { toast('Lỗi đọc tệp: ' + e.message, 'error'); }
    input.value = '';
  };
  r.readAsText(f, 'utf-8');
}
function resetDB() {
  confirmBox('Xóa toàn bộ dữ liệu hiện tại và nạp lại dữ liệu mẫu ban đầu (6 người dùng, 3 KHBD, 5 phiếu nhận xét, 15 nhật ký)?', async () => {
    await DB.seed(); S.user = DB.get('users', 'u1'); lsSet(SESSION_KEY, 'u1'); S.ws.planId = null; S.review = { planId:null, form:null };
    toast('Đã khôi phục dữ liệu mẫu.', 'success'); render();
  }, 'Khôi phục mẫu');
}

/* ------------------------------ 10. KHỞI ĐỘNG ------------------------------ */
(async function boot() {
  $('#app').innerHTML = `<div class="min-h-screen grid place-items-center text-slate-500 text-sm">Đang khởi tạo cơ sở dữ liệu…</div>`;
  await DB.init();
  const sid = lsGet(SESSION_KEY); const u = sid && DB.get('users', sid);
  if (u && u.status === 'active') S.user = u;
  render();
  window.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && S.view === 'workspace' && S.user) runAnalysis(); });
})();
</script>
